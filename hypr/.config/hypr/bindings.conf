  bindd = SUPER, SPA, Omarchy menu, exec, omarchy-menu
  bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new

#________________________
# Unbinding standard Omarchy keybinds
  #unbind = SUPER CTRL, E
  unbind = SUPER, W
  unbind = SUPER, F
  unbind = SUPER, T
  unbind = SUPER, J
  unbind = SUPER CTRL, E
  unbind = SUPER CTRL, L
  unbind = SUPER CTRL, I
  unbind = SUPER, TAB
  unbind = ALT, TAB
  unbind = SUPER, mouse_down
  unbind = SUPER, mouse_up

  bind = SUPER, Tab, focuscurrentorlast
  bind = SUPER SHIFT, Q, killactive,
  bindd = SUPER ALT, X, Force kill window, exec, hyprctl kill

#________________________
  bind = SUPER SHIFT, F, fullscreen
  bind = SUPER SHIFT, T, togglefloating,
  bind = SUPER SHIFT, P, pin
  bind = SUPER SHIFT, X, togglesplit,
  #bind = SUPER SHIFT, P, pseudo,

#________________________
# special workspace (scratchpad)
  bind = SUPER SHIFT, Minus, movetoworkspace, special:magic
  bind = SUPER, Minus, togglespecialworkspace, magic

#________________________
# Toggle for hiding waybar, also reload the config
  bind = SUPER Ctrl Alt, M, exec, pkill -SIGUSR1 waybar

#________________________
# Navigation between open windows
  bind = SUPER, h, movefocus, l
  bind = SUPER, l, movefocus, r
  bind = SUPER, k, movefocus, u
  bind = SUPER, j, movefocus, d

#________________________
# restart espanso
  bindd = SUPER CTRL, L, Espanso Restart, exec, espanso restart
  #bindd = SUPER CTRL, L, Espanso Restart, exec, espanso service start --unmanaged

  #________________________
# Zoom using Super+scroll wheel. https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks/#zoom
  bind = SUPER ALT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.6}')
  bind = SUPER ALT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.6}')
#________________________
# Ditto, but with keyboard
  binde = ALT, 1, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.2}')
  binde = ALT, 2, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.8}')
  bind = ALT, 3, exec, hyprctl -q keyword cursor:zoom_factor 1

#________________________
# Application bindings
  bindd = SUPER CTRL, RETURN, Terminal, exec, omarchy-launch-or-focus uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
  bindd = SUPER CTRL, F, File manager, exec, uwsm-app -- nautilus --new-window
  bindd = SUPER CTRL, I, Browser, exec, omarchy-launch-or-focus uwsm-app -- /opt/zen/zen
  bindd = SUPER CTRL, M, Music, exec, omarchy-launch-or-focus spotify
  bindd = SUPER CTRL, T, Activity, exec, omarchy-launch-tui btop
  bindd = SUPER CTRL, D, Passwords, exec, omarchy-launch-or-focus uwsm-app -- bitwarden-desktop

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
#bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
